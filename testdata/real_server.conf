port 1194
proto udp
dev tun
persist-key
persist-tun
keepalive 10 60
topology subnet
tun-mtu 1400
mssfix 1360
server 10.8.0.0 255.255.255.0
push "dhcp-option DNS 223.5.5.5"
push "dhcp-option DNS 114.114.114.114"
push "redirect-gateway def1 ipv6 bypass-dhcp"
dh none
tls-groups prime256v1
tls-crypt /pki/tc.key
crl-verify /pki/crl.pem
ca /pki/ca.crt
cert /pki/issued/server.crt
key /pki/private/server.key
auth SHA256
cipher AES-128-GCM
data-ciphers AES-128-GCM
tls-server
tls-version-min 1.2
tls-cipher TLS-ECDHE-ECDSA-WITH-AES-128-GCM-SHA256
auth-user-pass-verify /bin/openvpn-auth via-env
client-disconnect /bin/ovpn-helper.sh
client-connect /bin/ovpn-helper.sh
script-security 3
status /data/openvpn-status.log
client-config-dir /data/ccd
duplicate-cn
client-to-client
max-clients 200
management 127.0.0.1 7505
user nobody
group nogroup
verb 2
explicit-exit-notify 1
setenv ovpn_data /data
setenv auth_api http://127.0.0.1:8833/login
