<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenVPN-WEB</title>
    <link rel="icon" href="static/cropped-openvpn-32x32.png" sizes="32x32" />
    <link rel="icon" href="static/cropped-openvpn-192x192.png" sizes="192x192" />
    <link rel="apple-touch-icon" href="static/cropped-openvpn-180x180.png" />
    <link rel="stylesheet" type="text/css" href="static/css/bootstrap.min.css" />
    <link rel="stylesheet" type="text/css" href="static/css/gocaptcha.global.css" />
    <link rel="stylesheet" type="text/css" href="static/css/index.css" />
    <style>
      .form-check-label {
        padding-left: 0.15rem;
        cursor: pointer;
      }

      .bi {
        width: 1em;
        height: 1em;
        vertical-align: -0.125em;
        fill: currentcolor;
      }

      .captcha {
        display: flex;
        justify-content: center;
        align-items: center;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 9999;
        background: rgba(0, 0, 0, 0.5);
      }
    </style>
    <script>
      (function () {
        try {
          var t = localStorage.getItem('ovpn-theme');
          if (!t) {
            t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>

  <body>
    <section class="login-wrap" id="login">
      <button type="button" class="icon-btn login-theme" id="loginThemeToggle" title="切换主题" aria-label="切换主题">
        <svg class="icon i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
        <svg class="icon i-moon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
      <div class="login-card">
        <div class="login-logo">
          <svg class="icon" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        </div>
        <h1>OpenVPN</h1>
        <p class="lead">VPN 管理控制台</p>
        <form>
          <div class="field">
            <label for="loginUser">账号</label>
            <input type="text" id="loginUser" name="username" class="form-control form-control-lg" autocomplete="username" placeholder="请输入账号" required autofocus />
          </div>
          <div class="field">
            <label for="loginPass">密码</label>
            <input type="password" id="loginPass" name="password" class="form-control form-control-lg" autocomplete="current-password" placeholder="请输入密码" required />
          </div>
          <div class="d-flex justify-content-between align-items-center mb-3">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="remember7d" />
              <label class="form-check-label" for="remember7d">7天免登录</label>
            </div>
          </div>
          <button class="btn btn-primary btn-lg" type="submit">登录</button>
        </form>
      </div>
    </section>

    <div
      class="modal fade"
      data-bs-backdrop="static"
      data-bs-keyboard="false"
      tabindex="-1"
      id="mfaValidateModal"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <form>
            <div class="modal-header">
              <h5 class="modal-title">MFA</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body d-flex flex-column align-items-center">
              <p>输入来自您的验证器 App 的代码</p>

              <input
                type="text"
                class="form-control form-control-lg w-50"
                name="passcode"
                placeholder="xxxxxx"
                required
              />
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
              <button type="submit" class="btn btn-primary">确认</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <div
      class="modal fade"
      id="modifyPassModal"
      data-bs-backdrop="static"
      data-bs-keyboard="false"
      tabindex="-1"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <form>
            <div class="modal-header">
              <h2 class="modal-title fs-5">修改密码</h2>
            </div>
            <div class="modal-body">
              <div class="alert alert-warning d-flex align-items-center" role="alert">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  class="bi flex-shrink-0 me-2"
                  viewBox="0 0 16 16"
                  role="img"
                  aria-label="Warning:"
                >
                  <path
                    d="M8.982 1.566a1.13 1.13 0 0 0-1.96 0L.165 13.233c-.457.778.091 1.767.98 1.767h13.713c.889 0 1.438-.99.98-1.767L8.982 1.566zM8 5c.535 0 .954.462.9.995l-.35 3.507a.552.552 0 0 1-1.1 0L7.1 5.995A.905.905 0 0 1 8 5zm.002 6a1 1 0 1 1 0 2 1 1 0 0 1 0-2z"
                  />
                </svg>
                <div>这是您首次登录，为了安全请修改默认密码。</div>
              </div>
              <div class="form-group mb-3" hidden>
                <label>ID:</label>
                <input type="text" class="form-control form-control-sm float-end w-75" name="id" disabled />
              </div>
              <div class="form-group mb-3">
                <label>当前密码</label>
                <input
                  type="password"
                  autocomplete="current-password"
                  class="form-control form-control-sm float-end w-75"
                  name="currentPass"
                  required
                />
              </div>
              <div class="form-group mb-4">
                <label>新密码</label>
                <input
                  type="password"
                  autocomplete="new-password"
                  class="form-control form-control-sm float-end w-75"
                  name="newPass"
                  required
                />

                <div class="progress" role="progressbar" style="float: right; margin-top: 1px; width: 75%; height: 4px">
                  <div class="progress-bar bg-success" style="width: 0%"></div>
                </div>
              </div>
              <div class="form-group mb-3">
                <label>确认密码</label>
                <input
                  type="password"
                  autocomplete="new-password"
                  class="form-control form-control-sm float-end w-75"
                  name="newPassAgain"
                  required
                />
                <div class="form-text d-none mt-2" style="left: 27%; position: absolute"></div>
              </div>
            </div>
            <div class="modal-footer">
              <button type="submit" class="btn btn-primary">提交</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <div class="captcha" hidden>
      <div id="click-captcha"></div>
    </div>
  </body>
  <script type="text/javascript" src="static/js/lib/jquery.min.js"></script>
  <script type="text/javascript" src="static/js/lib/js.cookie.min.js"></script>
  <script type="text/javascript" src="static/js/lib/bootstrap.bundle.min.js"></script>
  <script type="text/javascript" src="static/js/lib/gocaptcha.global.js"></script>

  <script type="module">
    import '/static/js/utils.js';

    let redirect;
    let capt;
    let captchaKey;
    let needCaptcha;

    const captchaEl = document.getElementById('click-captcha');
    capt = new GoCaptcha.Click({
      width: 300,
      height: 220,
    });

    capt.mount(captchaEl);

    capt.setEvents({
      confirm(dots, reset) {
        login({ c_key: captchaKey, c_dots: JSON.stringify(dots) });
      },
      refresh() {
        requestCaptchaData();
      },
    });

    function requestCaptchaData() {
      request.get('/captcha').then((data) => {
        capt.clear();
        capt.setData({
          image: data.master,
          thumb: data.thumb,
        });
        captchaKey = data.key;
      });
    }

    function login(extra = {}) {
      const username = $('#login input[name="username"]').val();
      const password = $('#login input[name="password"]').val();
      const remember7d = $('#remember7d').is(':checked') ? 'on' : 'off';

      $.post('/login', { username, password, remember7d, ...extra }, function (data) {
        captchaEl.parentElement.hidden = true;
        if (data.message === '需要MFA验证') {
          $('#mfaValidateModal').modal('show');
        } else {
          redirect = data.redirect;
          if (data?.user?.isFirstLogin) {
            $('#modifyPassModal input[name="id"]').val(data.user.id);
            $('#modifyPassModal').modal('show');
          } else {
            message.success(data.message);
            setTimeout(() => {
              location.assign(redirect);
            }, 500);
          }
        }
      }).fail(function (xhr) {
        if (xhr.responseJSON?.message != '验证码错误') captchaEl.parentElement.hidden = true;

        needCaptcha = xhr.responseJSON?.needCaptcha || false;
        if (needCaptcha) {
          requestCaptchaData();
          captchaEl.parentElement.hidden = false;
        }

        if (xhr.responseJSON?.redirect) {
          location.assign(xhr.responseJSON.redirect);
        }

        message.error(xhr.responseJSON?.message || xhr.responseText || xhr.statusText);
      });
    }

    if (Cookies.get('remember7d') == 1) {
      $('#remember7d').prop('checked', true);
    }

    $('#remember7d').change(function () {
      if ($(this).is(':checked')) {
        Cookies.set('remember7d', 1, { expires: 7 });
      } else {
        Cookies.remove('remember7d');
      }
    });

    $('#loginThemeToggle').on('click', function () {
      const cur = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
      const next = cur === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      try {
        localStorage.setItem('ovpn-theme', next);
      } catch (e) {}
    });

    $('#login form').submit(function (e) {
      e.preventDefault();

      if (needCaptcha) {
        requestCaptchaData();
        captchaEl.parentElement.hidden = false;
        return;
      } else {
        login();
      }
    });

    $('#mfaValidateModal form').submit(function (e) {
      e.preventDefault();

      const passcode = $('#mfaValidateModal input[name="passcode"]').val();
      login({ passcode });
    });

    function checkPassword(pw) {
      let passed = 0;
      const rules = {
        length: (s) => s.length >= 12,
        lower: (s) => /[a-z]/.test(s),
        upper: (s) => /[A-Z]/.test(s),
        digit: (s) => /[0-9]/.test(s),
        special: (s) => /[!@#\$%\^&\*()_+\-=[\]{};':"\\|,.<>\/?]/.test(s),
      };

      for (const key in rules) {
        if (rules[key](pw)) passed++;
      }
      const percent = Math.round((passed / Object.keys(rules).length) * 100);

      return percent;
    }

    $(document).on('keyup', '#modifyPassModal input[name="newPassAgain"]', function () {
      const newPss = $('#modifyPassModal input[name="newPass"]').val();
      const newPassAgain = $('#modifyPassModal input[name="newPassAgain"]').val();

      if (newPassAgain == newPss) {
        $('#modifyPassModal .form-text').addClass('d-none');
        $('#modifyPassModal input[name="newPassAgain"]').removeClass('border border-danger');
        $('#modifyPassSumbit').removeAttr('disabled');
      } else {
        $('#modifyPassModal .form-text').text('密码不一致！');
        $('#modifyPassModal .form-text').addClass('text-danger');
        $('#modifyPassModal input[name="newPassAgain"]').addClass('border border-danger');
        $('#modifyPassModal .form-text').removeClass('d-none');
        $('#modifyPassSumbit').attr('disabled', true);
      }
    });

    $(document).on('input', '#modifyPassModal input[name="newPass"]', function (e) {
      const percent = checkPassword(e.target.value);
      const progressBar = $('#modifyPassModal .progress-bar');

      progressBar.width(percent + '%');
      progressBar.attr(
        'class',
        percent < 60
          ? 'progress-bar text-bg-danger'
          : 100 < percent > 60
          ? 'progress-bar bg-warning'
          : percent == 100
          ? 'progress-bar bg-success'
          : 'progress-bar bg-warning'
      );
    });

    $('#modifyPassModal form').submit(function () {
      const id = $('#modifyPassModal input[name="id"]').val();
      const newPass = $('#modifyPassModal input[name="newPassAgain"]').val();
      const currentPass = $('#modifyPassModal input[name="currentPass"]').val();

      if (checkPassword(newPass) != 100) {
        message.error('密码不满足要求（长度12位，包含大小写字母、数字、特殊字符）');
        return false;
      }

      request.post('/client/modifyPass', { id, currentPass, password: newPass, isFirstLogin: false }).then((data) => {
        $('#modifyPassModal .progress-bar').width('0%');
        $('#modifyPassModal form').trigger('reset');
        $('#modifyPassModal').modal('hide');
        message.success(data.message);
        setTimeout(() => {
          location.assign(redirect);
        }, 500);
      });

      return false;
    });
  </script>
</html>
